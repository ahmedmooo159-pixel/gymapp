<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>وحش الجيم | اسأل الكابتن الذكي (AI Coach)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .quick-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0 12px 0;
      scrollbar-width: none;
    }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-main);
    }
    .chip-btn:hover {
      border-color: var(--accent-purple);
      color: #fff;
    }
    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 8px;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent-purple);
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="app-container">
    
    <!-- Coach Header Info -->
    <div class="card" style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(6, 182, 212, 0.08) 100%); border-color: rgba(139, 92, 246, 0.3); padding: 14px 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #06b6d4); display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">
          🤖
        </div>
        <div>
          <h1 style="font-size: 1.15rem; color: #fff;">كابتن AI (مدربك الشخصي)</h1>
          <span style="font-size: 0.78rem; color: #c084fc;">متخصص في مساعدة وتوجيه المبتدئين بالمصري 🇪🇬</span>
        </div>
      </div>
    </div>

    <!-- Chat Messages Box -->
    <div class="card chat-container">
      <div id="chat-messages" class="chat-messages">
        
        <!-- Welcome Coach Message -->
        <div class="chat-bubble chat-coach">
          <div style="font-weight: 800; font-size: 0.82rem; color: #c084fc; margin-bottom: 2px;">كابتن وحش الجيم ⚡</div>
          يا هلا يا بطل! أنا كابتن الجيم الذكي الخاص بيك.
          <br>
          اسألني عن أي حاجة: شرح تمرين، إزاي تظبط نفسك، تتنفس إزاي، تختار أوزانك إزاي، أو تظبط أكلك. أنا معاك خطوة بخطوة 💪
        </div>

      </div>

      <!-- Quick Suggestion Chips -->
      <div class="quick-chips">
        <button class="chip-btn" data-q="إزاي أظبط تنفسي في التمارين؟">🫁 إزاي أتنفس صح في التمرين؟</button>
        <button class="chip-btn" data-q="إزاي أعرف الوزن المناسب للمبتدئ؟">⚖️ أختار وزني إزاي في البداية؟</button>
        <button class="chip-btn" data-q="أعمل إيه لو جالي وجع وتكسير في عضلاتي تاني يوم؟">🔥 وجع العضلات تاني يوم تمرين؟</button>
        <button class="chip-btn" data-q="أشرب ماية إزاي خلال جلسة التمرين؟">💧 شرب الماية أثناء التمرين؟</button>
      </div>

      <!-- Input Row -->
      <form id="chat-form" class="chat-input-row">
        <input type="text" id="chat-input" class="form-input" placeholder="اسأل الكابتن أي سؤال في الجيم..." autocomplete="off" required>
        <button type="submit" id="chat-send-btn" class="btn btn-primary" style="padding: 0 18px;">
          <span>إرسال</span>
          <span>🚀</span>
        </button>
      </form>
    </div>

  </main>

  <nav id="bottom-nav" class="bottom-nav"></nav>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { renderNavigation, showToast } from './js/ui.js';
    import { askAICoach } from './js/ai.js';

    let userState = null;
    let chatHistory = [];

    requireAuth(async ({ user, profile }) => {
      userState = { user, profile };
      renderNavigation('coach', profile);
    });

    const messagesBox = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send-btn');

    // Quick chips listener
    document.querySelectorAll('.chip-btn').forEach(chip => {
      chip.onclick = () => {
        chatInput.value = chip.dataset.q;
        chatForm.dispatchEvent(new Event('submit'));
      };
    });

    // Chat submit
    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      appendMessage('user', text);

      // Typing indicator
      const typingEl = document.createElement('div');
      typingEl.className = 'chat-bubble chat-coach';
      typingEl.id = 'typing-indicator';
      typingEl.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
      messagesBox.appendChild(typingEl);
      messagesBox.scrollTop = messagesBox.scrollHeight;

      sendBtn.disabled = true;

      try {
        const reply = await askAICoach(text, chatHistory, userState?.profile);

        // Update history
        chatHistory.push({ role: 'user', content: text });
        chatHistory.push({ role: 'assistant', content: reply });

        typingEl.remove();
        appendMessage('coach', reply);

      } catch (err) {
        console.error("AI Chat Error:", err);
        typingEl.remove();
        appendMessage('coach', "يا بطل حصل ضغط بسيط في السيرفر، بس أنا معاك! ركز على التكنيك الصح والتنفس المنتظم واشرب ماية كويسة 💪");
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    };

    function appendMessage(sender, text) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${sender === 'user' ? 'chat-user' : 'chat-coach'}`;
      
      if (sender === 'coach') {
        bubble.innerHTML = `
          <div style="font-weight: 800; font-size: 0.82rem; color: #c084fc; margin-bottom: 2px;">كابتن وحش الجيم ⚡</div>
          <div>${formatReply(text)}</div>
        `;
      } else {
        bubble.textContent = text;
      }

      messagesBox.appendChild(bubble);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function formatReply(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
